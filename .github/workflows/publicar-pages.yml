name: Publicar Gestão de Faturas no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'gestao-faturas-site*.zip'
      - '.github/workflows/publicar-pages.yml'
      - 'scripts/isolar-pwa.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicacao-gestao-faturas
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js (apenas no servidor do GitHub)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extrair pacote de publicação
        run: |
          pacote=$(find . -maxdepth 1 -type f -name 'gestao-faturas-site*.zip' -print -quit)
          if [ -z "$pacote" ]; then
            echo 'ERRO: Não foi encontrado o ZIP de publicação.'
            exit 1
          fi
          echo "A publicar pacote: $pacote"
          mkdir -p webapp
          unzip -q "$pacote" -d webapp
          test -f webapp/package.json
          test -f webapp/public/manifest.webmanifest

      - name: Isolar PWA das outras aplicações do domínio
        run: python3 scripts/isolar-pwa.py

      - name: Instalar dependências
        working-directory: webapp
        run: npm install --no-audit --no-fund

      - name: Verificar código
        working-directory: webapp
        run: npm run lint

      - name: Compilar PWA e verificar ficheiros offline
        working-directory: webapp
        run: npm run build

      - name: Confirmar identidade PWA e âmbito próprio
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('webapp/dist/manifest.webmanifest').read_text())
          assert manifest['id']=='/gestaoassinaturas/gestao-faturas-assinaturas-app', manifest['id']
          assert manifest['start_url']=='/gestaoassinaturas/'
          assert manifest['scope']=='/gestaoassinaturas/'
          html=Path('webapp/dist/index.html').read_text()
          assert 'href="/gestaoassinaturas/manifest.webmanifest"' in html
          assert "scope: '/gestaoassinaturas/'" in html
          sw=Path('webapp/dist/sw.js').read_text()
          assert 'gestao-faturas-assinaturas-pages-' in sw
          assert "requestUrl.pathname.startsWith('/gestaoassinaturas/')" in sw
          print('Identidade e âmbito da Gestão de Faturas exclusivos: OK')
          PY

      - name: Confirmar ausência de documentos no site publicado
        run: |
          test -f webapp/dist/index.html
          if find webapp/dist -type f \( -iname '*.pdf' -o -iname '*.xlsx' -o -iname '*.csv' -o -iname '*.jsonl' \) | grep -q .; then
            echo 'ERRO: Foi encontrado um documento no site publicado.'
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar ficheiros do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: webapp/dist

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
